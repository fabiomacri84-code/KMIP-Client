name: Build e release KMIP Client
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: kmip-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepara release provvisoria
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python packaging/check_version.py
      - name: Crea release provvisoria
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/prepare_release.py
  build:
    name: Build ${{ matrix.os }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verifica versione e tag
        run: python packaging/check_version.py
      - name: Dipendenze native Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libxcb-cursor0 libnss3 libasound2 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxrender1 libx11-xcb1 libxss1 libbrotli1 libgssapi-krb5-2 libsm6 libice6 libxcursor1 libxi6 libxkbfile1 libpulse0 libcups2
      - name: Installa dipendenze di build
        run: python -m pip install -r requirements-build.txt
      - name: Test automatici
        run: python -m unittest discover -s tests -v
      - name: Build nativa e controllo eseguibile
        timeout-minutes: 20
        run: python packaging/build.py
      - name: Carica pacchetto nella release provvisoria
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/upload_release.py
  release:
    name: Verifica e pubblica le tre build
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Scarica e verifica i tre pacchetti
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir release --pattern 'KMIP-Client-v*.zip' --pattern 'KMIP-Client-v*.tar.gz'
          python packaging/release_manifest.py release
      - name: Pubblica release completa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/SHA256SUMS.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

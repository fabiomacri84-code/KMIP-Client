name: Build e release KMIP Client
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: kmip-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verifica versione e tag
        run: python packaging/check_version.py
      - name: Dipendenze native Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libxcb-cursor0 libnss3 libasound2 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 libxrender1 libx11-xcb1 libxss1 libbrotli1 libgssapi-krb5-2 libsm6 libice6 libxcursor1 libxi6 libxkbfile1 libpulse0 libcups2
      - name: Installa dipendenze di build
        run: python -m pip install -r requirements-build.txt
      - name: Test automatici
        run: python -m unittest discover -s tests -v
      - name: Build nativa e controllo eseguibile
        run: python packaging/build.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: KMIP-Client-${{ runner.os }}
          path: |
            dist/KMIP-Client-v*.zip
            dist/KMIP-Client-v*.tar.gz
          if-no-files-found: error
          compression-level: 0
  release:
    name: Pubblica release con tutte le build
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Verifica i tre pacchetti e genera checksum
        run: python packaging/release_manifest.py release
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "KMIP Client $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
